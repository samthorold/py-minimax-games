name: Release

# Publishes a GitHub Release (tag + built distributions) whenever main has a
# pyproject version that hasn't been released yet. On PRs it runs as a dry run
# and reports what merging would publish.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Check for an unreleased version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/release-check.sh

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: uv build

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prerelease=""
          case "${TAG}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            ${prerelease}
          echo "Published **${TAG}**." >> "$GITHUB_STEP_SUMMARY"
