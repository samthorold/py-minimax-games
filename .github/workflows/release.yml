name: Release

# Publishes a GitHub Release (tag + built distributions) whenever main has a
# pyproject version that hasn't been released yet. On PRs it runs as a dry run
# and reports what merging would publish.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon: `uv build` makes the sdist and the macOS arm64 wheel (abi3,
    # so one wheel for every Python from 3.13) with the Rust extension module.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      # The toolchain rust-toolchain.toml pins (the sdist carries it, so the
      # wheel built from it uses it too).
      - name: Install Rust
        run: rustup toolchain install

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Check for an unreleased version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/release-check.sh

      # On every PR too, as the dry run: a change that breaks the build fails
      # here, not after merging a version bump.
      - name: Build
        if: steps.version.outputs.release == 'true' || github.event_name == 'pull_request'
        run: |
          uv build
          ls dist
          ls dist/*.tar.gz dist/*-macosx_*_arm64.whl > /dev/null
          echo "Built: $(cd dist && echo *)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prerelease=""
          case "${TAG}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            ${prerelease}
          echo "Published **${TAG}**." >> "$GITHUB_STEP_SUMMARY"
