[package]
name = "minimax-games-native"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiled engines for minimax-games: the extension module minimax_games._native."

[lib]
# The extension module's name: PyO3 exports `PyInit__native` from it.
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# A fast hash for the planner's transposition tables: their keys are whole
# states, hashed card by card, which SipHash makes most of a plan's time.
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py313"] }
# The planner's feature matrix crosses as a numpy array, without a copy.
numpy = { version = "0.30.0", optional = true }

[features]
# The Python boundary. maturin turns it on (`[tool.maturin]` in
# pyproject.toml); cargo test runs without it, as plain Rust with no Python
# to link against.
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "thin"
codegen-units = 1
