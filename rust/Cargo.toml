[package]
name = "minimax-games-native"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiled engines for minimax-games: the extension module minimax_games._native."

[lib]
# The extension module's name: PyO3 exports `PyInit__native` from it.
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py313"] }

[features]
# The Python boundary. maturin turns it on (`[tool.maturin]` in
# pyproject.toml); cargo test runs without it, as plain Rust with no Python
# to link against.
python = ["dep:pyo3"]

[profile.release]
lto = "thin"
codegen-units = 1
