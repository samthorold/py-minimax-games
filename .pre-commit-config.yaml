repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: check-added-large-files

  # Tools run through `uv run` so they use the versions pinned in uv.lock, and
  # work without an activated venv. `--locked` fails if uv.lock is stale.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]

      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types: [python]
        pass_filenames: false

      # actionlint also runs shellcheck on `run:` steps, since both are in the venv.
      - id: actionlint
        name: actionlint
        entry: uv run --locked actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: shellcheck
        name: shellcheck
        entry: uv run --locked shellcheck
        language: system
        types: [shell]

      - id: pytest
        name: pytest (incl. doctests)
        entry: uv run --locked pytest -q
        language: system
        types: [python]
        pass_filenames: false
