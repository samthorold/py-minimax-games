repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: check-added-large-files

  # Tools run through `uv run` so they use the versions pinned in uv.lock, and
  # work without an activated venv. `--locked` fails if uv.lock is stale.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]

      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      # actionlint also runs shellcheck on `run:` steps, since both are in the venv.
      - id: actionlint
        name: actionlint
        entry: uv run --locked actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: shellcheck
        name: shellcheck
        entry: uv run --locked shellcheck
        language: system
        types: [shell]

      # The Rust extension module (rust/), with the toolchain rust-toolchain.toml
      # pins. clippy lints the Python boundary too (`--all-features`), so it runs
      # through uv: PyO3's build script then finds the venv's Python.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --check
        language: system
        files: ^(rust/|rust-toolchain\.toml$)
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: uv run --locked cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
        language: system
        files: ^(rust/|rust-toolchain\.toml$)
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --manifest-path rust/Cargo.toml
        language: system
        files: ^(rust/|rust-toolchain\.toml$)
        pass_filenames: false

      # Also on Rust and TOML changes: `uv run` rebuilds the extension module
      # (`cache-keys` in pyproject.toml), and the differential tests check it
      # against the Python engine.
      - id: pytest
        name: pytest (incl. doctests)
        entry: uv run --locked pytest -q
        language: system
        types_or: [python, pyi, rust, toml]
        pass_filenames: false
