# https://taskfile.dev
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  test:
    desc: Run tests (including doctests)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  lint:
    desc: Lint, check formatting and type check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run ty check

  fmt:
    desc: Apply lint fixes and format
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  version:
    desc: Print the current package version
    cmds:
      - uv version --short
    silent: true

  bump:
    desc: "Bump the version: task bump -- patch|minor|major"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task bump -- patch|minor|major"
    cmds:
      - uv version --bump {{.CLI_ARGS}}

  bench:
    desc: "Benchmark the cheat's search (nodes/sec): task bench -- [--states] [--max-nodes N] [--budget N]"
    cmds:
      - uv run python -m minimax_games.games.star_realms bench {{.CLI_ARGS}}

  turn-sizes:
    desc: "Count each turn's distinct ends in heuristic games: task turn-sizes -- [--games N] [--max-states N] [--jobs N]"
    cmds:
      - uv run python -m minimax_games.games.star_realms turn-sizes {{.CLI_ARGS}}

  profile:
    desc: "Profile the cheat's budgeted decisions, report in profiles/: task profile -- [--budget N] [--game-turns N]"
    cmds:
      - uv run python -m minimax_games.games.star_realms profile {{.CLI_ARGS}}

  tune:
    desc: "Tune evaluate's weights by tournament (hours at the defaults): task tune -- [--fields W ...] [--games N] [--jobs N] [--cache FILE] [--screen]"
    cmds:
      - uv run python -m minimax_games.games.star_realms tune {{.CLI_ARGS}}

  fit:
    desc: "Fit learned values to heuristic-vs-heuristic games and gate them against evaluate (under a minute at the defaults): task fit -- [--games N] [--jobs N] [--save DIR]"
    cmds:
      - uv run python -m minimax_games.games.star_realms fit {{.CLI_ARGS}}

  pypy:
    desc: "Run a Star Realms command under PyPy 3.12 in .venv-pypy, for long tournaments: task pypy -- tournament --bots cheat greedy --games 60"
    cmds:
      # PyPy has no 3.13: --python-version 3.13 lets the project (requires-python >=3.13) install on 3.12.
      - uv venv --quiet --allow-existing --python pypy@3.12 .venv-pypy
      - uv pip install --quiet --python .venv-pypy --python-version 3.13 --reinstall-package minimax-games .
      - .venv-pypy/bin/python -m minimax_games.games.star_realms {{.CLI_ARGS}}
