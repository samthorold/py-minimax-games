# Star Realms base set: the Trade Deck (80 cards), the Explorer pile and the
# starting-deck cards. Game data only, read by catalogue.py.
#
# Sources (transcribed 2026-10-17, cross-checked against each other):
# - Card text, costs, defense, outpost/base and copies:
#   https://github.com/josschne/starrealms/blob/b660c0bdfb711dcf24a743163cea268f5506ea00/tradeCards.js
# - Names, costs, factions and types:
#   https://github.com/dhaven/sr-stats/blob/842791dc5c3c32ac19e18f7345400e9e7a2697a8/website/lib/card_data/core_set.js
# - Copies (the Core Set deck list):
#   https://github.com/captdeaf/srtts/blob/1c16cd42578f70de0f13a396c1c4d34a2cfd2ef7/src/sr_decks.lua
# - Explorer, Scout, Viper and the box contents (10 Explorers, 16 Scouts,
#   4 Vipers): https://rulespal.com/star-realms/rulebook and
#   https://files.wisewizardgames.com/wwg/rules/SRROE_Rulebook_Web_23-08-24.pdf
# - Disputed costs spot-checked against search excerpts of
#   https://megahaulin.com/2015/08/31/star-realms-card-tier-lists/ (Battle
#   Station 3, Recycling Station 4) and
#   https://starrealms.fandom.com/wiki/Imperial_Fighter (cost 1, 3 copies).
# Where the sources disagree: dhaven/sr-stats gives Stealth Needle cost 1;
# the others say 4, used here. It also lists every base as "base", so
# outposts come from josschne/starrealms.
#
# Format: one [[card]] table per card. `faction` is omitted for unaligned
# cards, `defense` for ships. `primary`, `ally` and `scrap` are lists of
# effects, each either `{ name = n }` (trade, combat, authority, draw,
# opponent_discards, scrap_hand_or_discard, scrap_trade_row,
# discard_then_draw, scrap_then_draw, ships_gain_combat), a bare string
# (destroy_base, next_ship_on_top, acquire_ship_free_on_top,
# draw_per_faction_card, scrap_from_hand, copy_ship, ally_for_all_factions),
# `{ draw_if_bases = { bases = b, cards = n } }`, or
# `{ choice = [[option effects], [option effects], ...] }`.

# Unaligned

[[card]]
name = "Scout"
type = "ship"
cost = 0
copies = 16
primary = [{ trade = 1 }]

[[card]]
name = "Viper"
type = "ship"
cost = 0
copies = 4
primary = [{ combat = 1 }]

[[card]]
name = "Explorer"
type = "ship"
cost = 2
copies = 10
primary = [{ trade = 2 }]
scrap = [{ combat = 2 }]

